/* ─────────────────────────────────────────────
   Data I/O
   ───────────────────────────────────────────── */
async function loadData() {
  let localData = null;
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { localData = JSON.parse(saved); }
    catch (e) { localData = null; }
  }

  try {
    const cloudRes = await fetch(CLOUD_SAVE_URL);
    if (cloudRes.ok) {
      const cloudData = await cloudRes.json();
      if (cloudData && Array.isArray(cloudData.books) && cloudData.books.length) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ books: cloudData.books }));
        return cloudData;
      }
    }
  } catch (e) {
    console.warn("Cloud load failed, falling back to local data:", e);
  }

  if (localData && Array.isArray(localData.books)) return localData;

  try {
    const res = await fetch("data.json");
    return await res.json();
  } catch (e) {
    return { books: [] };
  }
}
function persist() {
  const payload = { books: state.books };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));

  fetch(CLOUD_SAVE_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  }).catch((e) => {
    console.warn("Cloud save failed, local backup still saved:", e);
  });
}
function persistViewMode() {
  localStorage.setItem(VIEW_MODE_KEY, state.viewMode);
}

/* ─────────────────────────────────────────────
   Helpers
   ───────────────────────────────────────────── */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayLocalDate = () => {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
};

const formatDisplayDate = (value) => {
  if (!value) return "—";

  const parts = String(value).split("-");
  if (parts.length !== 3) return value;

  const year = parts[0].slice(-2);
  const month = String(Number(parts[1]));
  const day = String(Number(parts[2]));

  return `${month}/${day}/${year}`;
};
const spiceHtml = (n) => {
  const count = Math.max(0, Math.min(5, Number(n) || 0));

  return Array.from({ length: 5 }, (_, i) => {
    const isOn = i < count;
    const icon = i === 0 ? "🫑" : "🌶️";
    const offStyle = i === 0
      ? "opacity:0.32; filter:none;"
      : "opacity:0.26; filter:grayscale(1);";

    return `<span class="${isOn ? "" : "off"}" style="${isOn ? "" : offStyle}">${icon}</span>`;
  }).join("");
};

const starsHtml = (n) => {
  const count = Math.max(0, Math.min(5, Number(n) || 0));

  return Array.from({ length: 5 }, (_, i) => {
    return `<span class="${i < count ? "" : "off"}">🌟</span>`;
  }).join("");
};

function detectTropes(text) {
  const source = String(text || "").toLowerCase();
  if (!source.trim()) return [];
  return TROPE_KEYWORDS
    .filter((trope) => trope.terms.some((term) => source.includes(term)))
    .map((trope) => trope.label);
}

function detectSlowBurn(text, tropes = []) {
  const source = String(text || "").toLowerCase();
  const tropeList = Array.isArray(tropes) ? tropes : [];

  return ["slow burn", "slow-burn", "pining", "yearning", "enemies to lovers", "enemies-to-lovers"].some((term) => source.includes(term)) ||
    tropeList.includes("Slow Burn") ||
    tropeList.includes("Enemies To Lovers");
}

function inferGenreFromTropes(tropes = []) {
  const tropeList = Array.isArray(tropes) ? tropes : [];
  const genreMap = {
    "Chosen One / Prophecy": "Romantasy",
    "Fated Mates": "Romantasy",
    "Magic Academy": "Romantasy",
    "Immortal/Mortal": "Romantasy",
    "Fake Dating": "Contemporary Romance",
    "Second Chance": "Contemporary Romance",
    "Brother's Best Friend": "Contemporary Romance",
    "Small Town Romance": "Contemporary Romance",
    "Sports Romance": "Sports Romance",
    "Office Romance": "Contemporary Romance",
    "Single Parent Romance": "Contemporary Romance",
    "Ex Boyfriend's Dad": "Contemporary Romance",
    "MM": "Contemporary Romance",
  };

  for (const trope of tropeList) {
    if (genreMap[trope]) return genreMap[trope];
  }

  return "";
}

function showFinishedRatingPopup(book) {
  const existing = document.querySelector(".delete-confirm-backdrop");
  if (existing) existing.remove();

  let selectedRating = 0;

  const backdrop = document.createElement("div");
  backdrop.className = "delete-confirm-backdrop";

  }).join("");

  backdrop.innerHTML = `
    <div class="delete-confirm-box" style="
      width: min(360px, 100%);
      padding: 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1B1A2E 0%, #2A2338 58%, #381347 100%);
      border: 1px solid rgba(201, 154, 182, 0.42);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42), 0 0 28px rgba(162, 58, 111, 0.18);
      text-align: center;
      color: #fdf6f0;
    ">
      <div style="
        font-family: var(--body);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.5;
        color: #f5c7d4;
        margin-bottom: 16px;
      ">Star rating</div>
      <div class="finish-rating-picker" style="display:flex; justify-content:center; gap:4px; margin-bottom:20px;">
        ${ratingButtons}
      </div>
      <button class="finish-rating-done" type="button" style="
        min-width: 120px;
        padding: 12px 18px;
        border: 0;
        border-radius: 999px;
        background: #f5c7d4;
        color: #1B1A2E;
        font-family: var(--body);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
      ">Done</button>
    </div>
  `;

  document.body.appendChild(backdrop);

  const renderStars = () => {
    $$(".finish-rating-star", backdrop).forEach((btn) => {
      const value = Number(btn.dataset.rating) || 0;
      const isOn = selectedRating >= value;
      btn.classList.toggle("on", isOn);
      btn.style.opacity = isOn ? "1" : "0.28";
      btn.style.filter = isOn ? "none" : "grayscale(1)";
    });
  };

  $$(".finish-rating-star", backdrop).forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedRating = selectedRating === Number(btn.dataset.rating) ? 0 : Number(btn.dataset.rating);
      renderStars();
    });
  });

  backdrop.querySelector(".finish-rating-done").addEventListener("click", () => {
    book.status = "finished";
    book.rating = selectedRating;
    book.dateFinished = todayLocalDate();
    persist();
    renderAll();
    backdrop.remove();
    showSimpleConfirmMessage("Marked finished");
  });

  backdrop.addEventListener("click", (e) => {
    if (e.target === backdrop) backdrop.remove();
  });
}

/* ─────────────────────────────────────────────
   Filtering
   ───────────────────────────────────────────── */
function filterBooks() {
  const f = state.filters;
  const q = f.search.trim().toLowerCase();
  return state.books.filter((b) => {
    if (f.status !== "all" && b.status !== f.status) return false;
    if (q) {
      const hay = [b.title, b.author, b.seriesName, b.genre].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (f.spice != null && b.spice !== f.spice) return false;
    if (f.rating != null && b.rating !== f.rating) return false;
    if (f.genre && b.genre !== f.genre) return false;
    if (f.slowBurn != null && b.slowBurn !== f.slowBurn) return false;
    if (f.seriesStatus && b.seriesStatus !== f.seriesStatus) return false;
    if (Array.isArray(f.tropes) && f.tropes.length) {
      const bookTropes = [...new Set([...(Array.isArray(b.tropes) ? b.tropes : []), ...detectTropes([b.title, b.genre, b.notes].filter(Boolean).join(" "))])];
      if (!f.tropes.some((trope) => bookTropes.includes(trope))) return false;
    }
    return true;
  });
}

function activeFilterCount() {
  const f = state.filters;
  return (f.spice != null ? 1 : 0) + (f.rating != null ? 1 : 0) + (f.genre ? 1 : 0) + (f.slowBurn != null ? 1 : 0) + (f.seriesStatus ? 1 : 0) + (Array.isArray(f.tropes) ? f.tropes.length : 0);
}

function parseLocalDate(value) {
  if (!value) return null;
  const parts = String(value).split("-").map(Number);
  if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function isBookInStatsRange(book) {
  if (book.status !== "finished") return false;
  const finishedDate = parseLocalDate(book.dateFinished);
  if (!finishedDate) return false;

  const now = new Date();
  const mode = state.statsRange.mode;

  if (mode === "all") return true;

  if (mode === "month") {
    return finishedDate.getFullYear() === now.getFullYear() && finishedDate.getMonth() === now.getMonth();
  }

  if (mode === "year") {
    return finishedDate.getFullYear() === now.getFullYear();
  }

  if (mode === "custom") {
    const start = parseLocalDate(state.statsRange.startDate);
    const end = parseLocalDate(state.statsRange.endDate);
    if (start && finishedDate < start) return false;
    if (end && finishedDate > end) return false;
    return true;
  }

  return true;
}

function sortBooksForCurrentView(books) {
  const order = { reading: 0, vetting: 1, want: 2, finished: 3, dnf: 4 };
  const sorted = [...books].sort((a, b) => {
    const o = (order[a.status] ?? 9) - (order[b.status] ?? 9);
    if (o !== 0) return o;
    if (a.status === "finished") return (b.dateFinished || "").localeCompare(a.dateFinished || "");
    return (a.title || "").localeCompare(b.title || "");
  });

  if (state.viewMode !== "table") return sorted;

  const { key, direction } = state.tableSort;
  const multiplier = direction === "desc" ? -1 : 1;

  return sorted.sort((a, b) => {
    let aValue = a[key];
    let bValue = b[key];

    if (key === "status") {
      aValue = order[a.status] ?? 9;
      bValue = order[b.status] ?? 9;
    }

    if (["rating", "spice", "pageCount"].includes(key)) {
      aValue = Number(aValue) || 0;
      bValue = Number(bValue) || 0;
      return (aValue - bValue) * multiplier;
    }

    return String(aValue || "").localeCompare(String(bValue || "")) * multiplier;
  });
}

function tableSortLabel(key, label) {
  const isActive = state.tableSort.key === key;
  const arrow = !isActive ? "" : state.tableSort.direction === "asc" ? " ↑" : " ↓";
  return `${label}${arrow}`;
}

              <th><button class="book-table-sort ${state.tableSort.key === "rating" ? "active" : ""}" type="button" data-sort="rating">${tableSortLabel("rating", "Rating")}</button></th>
              <th><button class="book-table-sort ${state.tableSort.key === "spice" ? "active" : ""}" type="button" data-sort="spice">${tableSortLabel("spice", "Spice")}</button></th>
              <th><button class="book-table-sort ${state.tableSort.key === "pageCount" ? "active" : ""}" type="button" data-sort="pageCount">${tableSortLabel("pageCount", "Pages")}</button></th>

        : `

      : `

          <div class="book-page-count">${b.pageCount ? `${escapeHtml(b.pageCount)} pages` : "—"}</div>
          <div class="book-date-added">${formatDisplayDate(b.dateAdded)}</div>
          <div class="book-spice-preview"><span>Spice</span> ${spiceHtml(b.spice)}</div>

              <svg viewBox="0 -960 960 960" aria-hidden="true">

              </svg>

    const quickActions = isDone

    return `

            ${series}

        <div class="book-mid">

  root.innerHTML = `<div class="book-grid">${cards}</div>`;

  $$(".book", root).forEach((el) => {

  $$(".book-quick-action", root).forEach((btn) => {
    btn.addEventListener("click", (e) => {

      const book = state.books.find((item) => String(item.id) === String(btn.dataset.id));
      if (!book) return;

      if (btn.dataset.action === "finished") {

function renderStats() {

    ? (ratedBooks.reduce((s, b) => s + (b.rating || 0), 0) / ratedBooks.length).toFixed(1)

function openSheet({ title, body, save, sheetClass = "" }) {
  $("#sheetTitle").textContent = title;
  const existingTopEdit = $("#sheetTopEdit");
  if (existingTopEdit) existingTopEdit.remove();
  $("#sheetBody").innerHTML = "";
  if (typeof body === "string") $("#sheetBody").innerHTML = body;
  else if (body instanceof Node) $("#sheetBody").appendChild(body);
  $("#sheet").className = "sheet open " + sheetClass;
  $("#backdrop").classList.add("open");
  const saveBtn = $("#sheetSave");
  if (save) {
    saveBtn.hidden = false;
    saveBtn.onclick = save;
  } else {
    saveBtn.hidden = true;
    saveBtn.onclick = null;
  }
  document.body.style.overflow = "hidden";

  requestAnimationFrame(() => {
    const sheetBody = $("#sheetBody");
    if (sheetBody) sheetBody.scrollTop = 0;
  });
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#backdrop").classList.remove("open");
  document.body.style.overflow = "";
}
$("#sheetClose").addEventListener("click", closeSheet);
$("#backdrop").addEventListener("click", closeSheet);

function showDescriptionPopup(title, description) {

let googleBooksLookupAbort = null;
let googleBooksLookupTimer = null;
const googleBooksLookupCache = new Map();
let lastGoogleBooksQuery = "";
const GOOGLE_BOOKS_API_KEY = "HIDDEN API INFO";

function normalizeGoogleBook(item) {
  const info = item.volumeInfo || {};
  const industryIds = Array.isArray(info.industryIdentifiers) ? info.industryIdentifiers : [];
  const isbn13 = industryIds.find((id) => id.type === "ISBN_13")?.identifier || "";
  const isbn10 = industryIds.find((id) => id.type === "ISBN_10")?.identifier || "";
  const isbn = isbn13 || isbn10;
  const titleAuthorSearch = [info.title, Array.isArray(info.authors) ? info.authors.join(" ") : ""].filter(Boolean).join(" ");
  const coverUrl = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || "";
  const tropeSource = [info.title, info.subtitle, info.description, info.mainCategory, Array.isArray(info.categories) ? info.categories.join(" ") : ""].filter(Boolean).join(" ");

  return {
    title: info.title || "",
    author: Array.isArray(info.authors) ? info.authors.join(", ") : "",
    seriesName: "",
    genre: "",
    seriesStatus: "standalone",
    seriesCurrent: 1,
    seriesTotal: 1,
    publicationDate: info.publishedDate || "",
    pageCount: info.pageCount || 0,
    notes: info.description || "",
    tropes: detectTropes(tropeSource),
    slowBurn: detectSlowBurn(tropeSource),
    goodreadsUrl: isbn ? `https://www.goodreads.com/search?q=${encodeURIComponent(isbn)}` : `https://www.goodreads.com/search?q=${encodeURIComponent(titleAuthorSearch)}`,
    romanceIoUrl: `https://www.romance.io/search?q=${encodeURIComponent(titleAuthorSearch)}`,
    sobriefUrl: `https://sobrief.com/search?q=${encodeURIComponent(info.title || "")}`,
    coverUrl: coverUrl ? coverUrl.replace("http://", "https://") : "",
  };
}


async function enrichOpenLibraryBook(book) {
  return { ...book };
}

function normalizeOpenLibraryBook(item) {
  const isbn = Array.isArray(item.isbn) ? item.isbn[0] : "";
  const titleAuthorSearch = [item.title, Array.isArray(item.author_name) ? item.author_name.join(" ") : ""].filter(Boolean).join(" ");
  const coverUrl = item.cover_i ? `https://covers.openlibrary.org/b/id/${item.cover_i}-L.jpg` : "";
  const tropeSource = [item.title, Array.isArray(item.subject) ? item.subject.join(" ") : "", Array.isArray(item.first_sentence) ? item.first_sentence.join(" ") : ""].filter(Boolean).join(" ");

  return {
    title: item.title || "",
    author: Array.isArray(item.author_name) ? item.author_name.join(", ") : "",
    seriesName: "",
    seriesStatus: "standalone",
    seriesCurrent: 1,
    seriesTotal: 1,
    publicationDate: item.first_publish_year ? String(item.first_publish_year) : "",
    pageCount: item.number_of_pages_median || 0,
    notes: item.first_sentence?.[0] || "",
    tropes: detectTropes(tropeSource),
    slowBurn: detectSlowBurn(tropeSource),
    goodreadsUrl: isbn ? `https://www.goodreads.com/search?q=${encodeURIComponent(isbn)}` : `https://www.goodreads.com/search?q=${encodeURIComponent(titleAuthorSearch)}`,
    romanceIoUrl: `https://www.romance.io/search?q=${encodeURIComponent(titleAuthorSearch)}`,
    sobriefUrl: `https://sobrief.com/search?q=${encodeURIComponent(item.title || "")}`,
    coverUrl,
  };
}

function renderGoogleBookResults(resultsBox, books, draft, wrap) {
  if (!resultsBox) return;

  if (!books.length) {
    resultsBox.innerHTML = `<div class="google-books-empty">No book matches found.</div>`;
    resultsBox.hidden = false;
    return;
  }

  resultsBox.innerHTML = books.map((book, index) => {
    const fallbackCover = `book-img/book-img-${(index % 10) + 1}.png`;
    const resultCover = book.coverUrl || fallbackCover;

    return `
      <button class="google-book-result" type="button" data-book-index="${index}">
        <span class="google-book-result-cover-wrap">
          <img class="google-book-result-cover" src="${escapeHtml(resultCover)}" alt="" loading="lazy">
        </span>
        <span class="google-book-result-copy">
          <span class="google-book-title">${escapeHtml(book.title || "Untitled")}</span>
          <span class="google-book-meta">${escapeHtml(book.author || "Unknown author")}${book.publicationDate ? ` · ${escapeHtml(book.publicationDate)}` : ""}</span>
        </span>
      </button>
    `;
  }).join("");

  resultsBox.hidden = false;

  $$(".google-book-result", resultsBox).forEach((btn) => {
    btn.addEventListener("click", async () => {
      const selected = books[parseInt(btn.dataset.bookIndex, 10)];
      if (!selected) return;

      resultsBox.innerHTML = `<div class="google-books-empty">Filling book details…</div>`;
      resultsBox.hidden = false;

      const enriched = await enrichOpenLibraryBook(selected);
      Object.assign(draft, enriched);

      const fieldsToUpdate = ["title", "author", "seriesName", "seriesCurrent", "seriesTotal", "publicationDate", "pageCount", "notes", "goodreadsUrl", "romanceIoUrl", "sobriefUrl"];
      fieldsToUpdate.forEach((key) => {
        const field = $(`[data-k='${key}']`, wrap);
        if (field) field.value = draft[key] ?? "";
      });

      const seriesButtons = $$(`[data-seg='seriesStatus'] button`, wrap);
      seriesButtons.forEach((button) => button.classList.toggle("on", button.dataset.v === draft.seriesStatus));

      const slowBurnButtons = $$(`[data-seg='slowBurn'] button`, wrap);
      slowBurnButtons.forEach((button) => button.classList.toggle("on", String(button.dataset.v) === String(draft.slowBurn)));

      resultsBox.hidden = true;
      resultsBox.innerHTML = "";
    });
  });
}

function attachGoogleBooksLookup(wrap, draft) {
  const titleInput = $(`input[data-k='title']`, wrap);
  const searchBtn = $("#bookTitleSearchBtn", wrap);
  const resultsBox = $("#googleBooksResults", wrap);
  if (!titleInput || !searchBtn || !resultsBox) return;

  const runSearch = async () => {
    const query = titleInput.value.trim();
    draft.title = titleInput.value;

    if (query.length < 2) {
      resultsBox.hidden = false;
      resultsBox.innerHTML = `<div class="google-books-empty">Type a title first.</div>`;
      return;
    }

    const cacheKey = query.toLowerCase();
    if (googleBooksLookupCache.has(cacheKey)) {
      renderGoogleBookResults(resultsBox, googleBooksLookupCache.get(cacheKey), draft, wrap);
      return;
    }

    resultsBox.hidden = false;
    resultsBox.innerHTML = `<div class="google-books-empty">Searching Google Books…</div>`;
    searchBtn.disabled = true;
    searchBtn.textContent = "Searching";

    try {
      if (googleBooksLookupAbort) googleBooksLookupAbort.abort();
      googleBooksLookupAbort = new AbortController();

      const googleUrl = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=5&printType=books&key=${GOOGLE_BOOKS_API_KEY}`;
      const response = await fetch(googleUrl, { signal: googleBooksLookupAbort.signal });

      if (response.status === 429) {
        resultsBox.innerHTML = `<div class="google-books-empty">Google is rate-limiting, trying backup search…</div>`;
        const backupUrl = `https://openlibrary.org/search.json?title=${encodeURIComponent(query)}&limit=5`;
        const backupResponse = await fetch(backupUrl, { signal: googleBooksLookupAbort.signal });
        if (!backupResponse.ok) throw new Error(`Backup search failed: ${backupResponse.status}`);
        const backupData = await backupResponse.json();
        const backupBooks = Array.isArray(backupData.docs) ? backupData.docs.map(normalizeOpenLibraryBook) : [];
        googleBooksLookupCache.set(cacheKey, backupBooks);
        renderGoogleBookResults(resultsBox, backupBooks, draft, wrap);
        return;
      }

      if (!response.ok) throw new Error(`Google Books request failed: ${response.status}`);

      const data = await response.json();
      const books = Array.isArray(data.items) ? data.items.map(normalizeGoogleBook) : [];
      googleBooksLookupCache.set(cacheKey, books);
      renderGoogleBookResults(resultsBox, books, draft, wrap);
    } catch (error) {
      if (error.name === "AbortError") return;
      console.error("Google Books lookup failed:", error);
      resultsBox.innerHTML = `<div class="google-books-empty">Could not load Google Books results. ${escapeHtml(error.message || "")}</div>`;
      resultsBox.hidden = false;
    } finally {
      searchBtn.disabled = false;
      searchBtn.textContent = "Search";
    }
  };

  searchBtn.addEventListener("click", runSearch);

  titleInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      runSearch();
    }
  });

  titleInput.addEventListener("input", () => {
    draft.title = titleInput.value;
  });

  titleInput.addEventListener("focus", () => {
    if (resultsBox.innerHTML.trim()) resultsBox.hidden = false;
  });
}

      renderAll();
      closeSheet();
      if (isNew) {

    renderAll();
    closeSheet();
  });

    state.filters = { ...state.filters, ...f };
    renderAll();
    closeSheet();
  });

  openSheet({ title: "Filters", body: wrap, sheetClass: "detail-popup-sheet filter-sheet" });

});

$("#statsRangeBar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-range]");
  if (!btn) return;
  state.statsRange.mode = btn.dataset.range;
  renderStats();
});

$("#statsStartDate").addEventListener("input", (e) => {
  state.statsRange.startDate = e.target.value;
  state.statsRange.mode = "custom";
  renderStats();
});

$("#statsEndDate").addEventListener("input", (e) => {
  state.statsRange.endDate = e.target.value;
  state.statsRange.mode = "custom";
  renderStats();
});

/* ─────────────────────────────────────────────
   Init
   ───────────────────────────────────────────── */
function renderAll() {
  renderStatusTabs();
  renderViewToggle();
  renderList();
  if (!$("#statsPanel").hidden) renderStats();
}

(async function init() {
  const data = await loadData();
  state.books = data.books || [];
  renderAll();
})();
</script>
</body>
</html>
